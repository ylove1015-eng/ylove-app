    async function connectSupabase(user){
      state.userId=user.id;
      const {data,error}=await sb.from('youlove_records').select('id,kind,data,updated_at').order('updated_at',{ascending:false});
      if(error){console.warn('Supabase 준비 필요:',error);state.dbReady=false;render();toast('Supabase 설정 SQL을 먼저 실행해주세요');return}
      state.dbReady=true;
      const next=structuredClone(initialData);
      for(const row of data||[])if(next[row.kind]&&!FIGMA_MOCK_IDS.has(row.id))next[row.kind].push({...row.data,id:row.id});
      state.data=normalizeData(next);
      localStorage.setItem(STORAGE_KEY,JSON.stringify(state.data));
      render();
      await flushPendingRemoteDeletes();
      await syncAll();
    }
    async function refreshAppData(showMessage=true){
      if(refreshing)return;
      refreshing=true;pullEl.classList.add('visible','refreshing');pullText.textContent='최신 자료 불러오는 중';
      try{
        if(!sb||!state.userId){await initSupabase();if(showMessage)toast(state.dbReady?'최신 자료로 새로고침했어요':'기기 자료를 새로고침했어요');return}
        const {data,error}=await sb.from('youlove_records').select('id,kind,data,updated_at').order('updated_at',{ascending:false});
        if(error)throw error;
        const next=structuredClone(initialData);
        for(const row of data||[])if(next[row.kind]&&!FIGMA_MOCK_IDS.has(row.id))next[row.kind].push({...row.data,id:row.id});
        state.data=normalizeData(next);localStorage.setItem(STORAGE_KEY,JSON.stringify(state.data));render();await flushPendingRemoteDeletes();lastAutoRefresh=Date.now();
        if(showMessage)toast('최신 자료로 새로고침했어요');
      }catch(error){console.warn('새로고침 실패:',error);state.data=loadData();render();if(showMessage)toast('인터넷 연결을 확인해주세요')}
      finally{refreshing=false;pullDistance=0;pulling=false;pullText.textContent='아래로 당겨 새로고침';setTimeout(()=>{pullEl.classList.remove('visible','refreshing');pullEl.style.transform=''},260)}
    }
    function updatePullIndicator(distance){const y=Math.min(8,-58+distance);pullEl.style.transform=`translate(-50%,${y}px)`;pullEl.classList.toggle('visible',distance>8);pullText.textContent=distance>=64?'놓으면 새로고침':'아래로 당겨 새로고침'}
    function canStartPull(target){return !refreshing&&!modalRoot.firstElementChild&&(document.scrollingElement?.scrollTop||0)<=0&&!target.closest('input,textarea,select,button,a')}
    async function syncAll(){if(!sb||!state.dbReady)return;const rows=recordsFromState();if(!rows.length)return;const {error}=await sb.from('youlove_records').upsert(rows,{onConflict:'id'});if(error){console.warn('Supabase 저장 실패:',error.message);toast('기기에는 저장됐지만 서버 저장을 확인해주세요')}}
    async function deleteRemote(id){if(!sb||!state.dbReady)return;const {error}=await sb.from('youlove_records').delete().eq('id',id);if(error)console.warn('Supabase 삭제 실패:',error.message)}
    async function flushPendingRemoteDeletes(){if(!sb||!state.dbReady||!pendingRemoteDeleteIds.length)return;const ids=[...new Set(pendingRemoteDeleteIds)];pendingRemoteDeleteIds=[];const {error}=await sb.from('youlove_records').delete().in('id',ids);if(error)console.warn('이전 중복 강의일정 정리 실패:',error.message)}
    function icon(name,cls=''){return `<i data-lucide="${name}" class="${cls}"></i>`}
    function icons(){if(window.lucide)lucide.createIcons()}
    function toast(msg){clearTimeout(toastTimer);toastEl.textContent=msg;toastEl.classList.add('show');toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1800)}
    function cleanupUrls(){state.objectUrls.forEach(URL.revokeObjectURL);state.objectUrls=[]}

    function nav(){return `<nav class="bottom-nav" aria-label="주요 메뉴">
      ${navBtn('home','house','홈')}${navBtn('schedule','calendar-days','스케줄')}${navBtn('lectures','book-open','강의기록')}${navBtn('payments','credit-card','입금확인')}${navBtn('materials','folder','자료전달')}
    </nav>`}
    function navBtn(tab,ico,label){return `<button class="nav-btn ${state.tab===tab?'active':''}" data-action="nav" data-tab="${tab}">${icon(ico)}<span>${label}</span></button>`}
    function header(title,back=false){return `<header class="topbar"><div class="back-title">${back?`<button class="icon-btn" data-action="back" aria-label="뒤로">${icon('chevron-left')}</button>`:''}<h1>${esc(title)}</h1></div><button class="icon-btn" data-action="notice" aria-label="알림">${icon('bell')}</button></header>`}    function empty(ico,title,text,button=''){return `<div class="card empty">${icon(ico)}<strong>${esc(title)}</strong><span>${esc(text)}</span>${button}</div>`}

    function renderLoading(){app.innerHTML=`<section class="loading-page"><div><img class="loading-logo" src="./icons/icon.svg" alt=""><div>Youlove를 준비하고 있어요</div></div></section>`}
    function render(){cleanupUrls();let html='';if(state.detailId)html=renderLectureDetail();else if(state.tab==='home')html=renderHome();else if(state.tab==='schedule')html=renderSchedule();else if(state.tab==='lectures')html=renderLectures();else if(state.tab==='payments')html=renderPayments();else html=renderMaterials();app.innerHTML=html+nav();icons();hydrateBlobs()}

    function renderHome(){const t=today();const events=allSchedule().filter(x=>x.date===t).sort(sortTime);const tasks=state.data.tasks.filter(x=>x.date===t);const lectureCount=events.filter(x=>x.type==='lecture').length,personalCount=events.filter(x=>x.type==='personal').length,doneTaskCount=tasks.filter(x=>x.done).length;return `<section class="page">
      <div class="home-top"><div class="date-kicker">${longKoDate(t)}</div><button class="install-app-btn" data-action="install-app">${icon('download')}<span>앱 설치</span></button></div><h1 class="greeting">유사랑님,<br>좋은 아침이에요 ☀️</h1>
      <div class="summary-grid home-summary">
        ${summary('오늘 일정',events.length,`강의 ${lectureCount} · 개인 ${personalCount}`,'calendar-days')}
        ${summary('오늘 할 일',tasks.length,`완료 ${doneTaskCount} · 남은 일 ${tasks.length-doneTaskCount}`,'square-check-big')}
      </div>
      <div class="section-head"><h2>오늘의 주요 일정</h2><button class="text-btn" data-action="nav" data-tab="schedule">전체보기</button></div>
      ${events.length?events.slice(0,3).map(scheduleCard).join(''):empty('calendar-x','오늘 일정이 없어요','새 일정을 등록해보세요')}
      <div class="section-head"><h2>오늘 할 일</h2><button class="text-btn" data-action="nav" data-tab="schedule">전체보기</button></div>
      ${tasks.length?tasks.map(taskCard).join(''):empty('list-checks','등록된 할 일이 없어요','오늘 해야 할 일을 추가해보세요')}
    </section>`}
    function summary(label,value,hint,ico){return `<div class="summary-card"><div class="label">${label}</div><div class="corner">${icon(ico)}</div><div class="value">${value}건</div><div class="hint">${esc(hint)}</div></div>`}
    function allSchedule(){const independent=state.data.events.filter(e=>!e.lectureId);const lectureEvents=state.data.lectures.map(l=>({id:'lecture_'+l.id,lectureId:l.id,type:'lecture',title:l.title,date:l.date,start:l.start,end:l.end,location:l.location||l.institution}));return [...independent,...lectureEvents]}
    function sortTime(a,b){return (a.start||'99:99').localeCompare(b.start||'99:99')}
    function scheduleCard(x){const personal=x.type==='personal';return `<button class="card schedule-card" style="width:100%;text-align:left" data-action="schedule-open" data-id="${esc(x.id)}" data-lecture-id="${esc(x.lectureId||'')}"><div class="schedule-time ${personal?'personal':''}">${esc(x.start||'시간 미정')}</div><div class="schedule-title">${esc(x.title)}</div><div class="schedule-meta">${icon('map-pin')} ${esc(x.location||'장소 미정')}</div></button>`}
    function taskCard(x){return `<div class="card task-card ${x.done?'done':''}"><button class="check ${x.done?'checked':''}" data-action="task-toggle" data-id="${x.id}" aria-label="완료 상태 변경"></button><button class="text-btn task-title" style="text-align:left;color:inherit" data-action="task-edit" data-id="${x.id}">${esc(x.title)}</button></div>`}

    function renderSchedule(){const y=state.calendar.getFullYear(),m=state.calendar.getMonth();const selected=state.selectedDate;const items=allSchedule().filter(x=>x.date===selected).sort(sortTime);const tasks=state.data.tasks.filter(x=>x.date===selected);return `<section class="page">${header('스케줄')}
      <div class="card calendar"><div class="cal-head"><button class="cal-arrow" data-action="cal-prev">${icon('chevron-left')}</button><div class="cal-title">${y}년 ${m+1}월</div><button class="cal-arrow" data-action="cal-next">${icon('chevron-right')}</button></div>
      <div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="days">${calendarDays(y,m)}</div></div>
      <div class="section-head"><h2>${koDate(selected)} 일정</h2><button class="section-add-btn" data-action="event-add">${icon('plus')}<span>일정 추가</span></button></div>
      ${items.length?items.map(dayAgendaCard).join(''):empty('calendar-x','이날 일정이 없어요','새 일정을 등록해보세요')}
      <div class="section-head"><h2>${icon('square-check-big')} 할 일</h2><button class="section-add-btn" data-action="task-add">${icon('plus')}<span>할 일 추가</span></button></div>
      ${tasks.length?tasks.map(taskCard).join(''):empty('list-checks','할 일이 없어요','이 날짜에 할 일을 추가할 수 있어요')}
    </section>`}
    function dayAgendaCard(x){const personal=x.type==='personal';return `<button class="card day-agenda ${personal?'personal':''}" style="display:block;width:100%;text-align:left" data-action="schedule-open" data-id="${esc(x.id)}" data-lecture-id="${esc(x.lectureId||'')}"><div class="agenda-top"><span class="agenda-time">${icon('clock-3')}${esc(x.start||'시간 미정')}${x.end?' - '+esc(x.end):''}</span><span class="agenda-tag">${personal?'개인':'강의'}</span></div><div class="agenda-title">${esc(x.title)}</div>${personal?'':`<div class="agenda-place">기관: ${esc(x.location||'장소 미정')}</div>`}</button>`}
    function calendarDays(y,m){const first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate(),prevLast=new Date(y,m,0).getDate();const activity=allSchedule();let out='';for(let i=0;i<42;i++){let d,cm=m,muted=false;if(i<first){d=prevLast-first+i+1;cm=m-1;muted=true}else if(i>=first+last){d=i-first-last+1;cm=m+1;muted=true}else d=i-first+1;const dt=new Date(y,cm,d),key=dateKey(dt);const types=activity.filter(x=>x.date===key).map(x=>x.type);out+=`<button class="day ${muted?'muted':''} ${key===state.selectedDate?'selected':''} ${key===today()?'today':''}" data-action="date-select" data-date="${key}">${d}${types.length?`<span class="dots"><i class="dot"></i>${types.includes('personal')?'<i class="dot blue"></i>':''}</span>`:''}</button>`}return out}

    function renderLectures(){const f=state.lectureFilter,q=state.lectureQuery.trim().toLowerCase();let list=[...state.data.lectures];if(f==='planned')list=list.filter(x=>x.status==='planned');if(f==='done')list=list.filter(x=>x.status==='done');if(q)list=list.filter(x=>[x.title,x.institution,x.location,x.managerName,x.managerPhone,x.audience,x.notes,x.date].some(v=>String(v||'').toLowerCase().includes(q)));list.sort(lectureSorter);return `<section class="page lecture-page">${header('강의기록')}<form class="lecture-search" data-form="lecture-search"><div class="lecture-search-box">${icon('search')}<input class="control" name="query" type="search" value="${esc(state.lectureQuery)}" placeholder="강의명·기관·담당자 검색" aria-label="강의기록 검색">${state.lectureQuery?`<button type="button" class="lecture-search-clear" data-action="lecture-search-clear" aria-label="검색어 지우기">${icon('x')}</button>`:''}</div><button class="btn" type="submit">검색</button></form><div class="lecture-tools"><div class="filter-row">${[['all','전체'],['planned','강의 예정'],['done','강의 완료']].map(([k,v])=>`<button class="chip ${f===k?'active':''}" data-action="lecture-filter" data-filter="${k}">${v}</button>`).join('')}</div><label class="sort-control" aria-label="강의 정렬">${icon('arrow-up-down')}<select class="sort-select" data-action="lecture-sort"><option value="newest" ${state.lectureSort==='newest'?'selected':''}>최신순</option><option value="oldest" ${state.lectureSort==='oldest'?'selected':''}>오래된순</option><option value="feeHigh" ${state.lectureSort==='feeHigh'?'selected':''}>강사료순</option></select></label></div>
      ${list.length?list.map(lectureCard).join(''):empty('book-open',q?'검색 결과가 없어요':'강의 기록이 없어요',q?'다른 검색어를 입력해보세요':'첫 강의를 등록해보세요',q?'':`<button class="btn primary" style="margin-top:18px" data-action="lecture-add">＋ 강의 등록</button>`)}
      <button class="fab lecture-fab" data-action="lecture-add" aria-label="강의 등록">${icon('plus')}<span>강의 등록</span></button></section>`}
    function lectureSorter(a,b){if(state.lectureSort==='oldest')return (a.date||'').localeCompare(b.date||'')||(a.start||'').localeCompare(b.start||'');if(state.lectureSort==='feeHigh')return Number(b.fee||0)-Number(a.fee||0)||(b.date||'').localeCompare(a.date||'');return (b.date||'').localeCompare(a.date||'')||(b.start||'').localeCompare(a.start||'')||(b.createdAt||'').localeCompare(a.createdAt||'')}
    function lectureCard(l){const done=l.status==='done',status=done?'강의 완료':'강의 예정',cls=done?'done':'planned';const needs=!!l.needsRecordUpdate,hasFee=Number(l.fee)>0;return `<button class="card lecture-card ${needs?'needs-record':''}" style="display:block;width:100%;text-align:left" data-action="lecture-open" data-id="${l.id}"><div class="lecture-top"><span class="status ${cls}">${status}</span></div>${needs?`<div class="record-needed">${icon('circle-alert')}<span>강의 종료 후 기록 보완 필요</span></div>`:''}<div class="lecture-title">${esc(l.title)}</div><div class="lecture-lines"><div class="lecture-line">${icon('map-pin')} ${esc(l.location||l.institution||'장소 미정')}</div><div class="lecture-line">${icon('clock-3')} ${esc(koDate(l.date))} ${esc(l.start||'')}</div><div class="lecture-line">${icon('users')} ${esc(l.audience||'대상 미정')}${l.people?` ${esc(l.people)}명`:''}</div></div><div class="fee-line"><span>${l.isFree?'강의료 구분':hasFee?'강사료':'강사료 미입력'}</span><strong>${l.isFree?'무페이':hasFee?'₩'+money(l.fee):'기록 필요'}</strong></div></button>`}

    function renderPayments(){const all=state.data.lectures.filter(x=>x.isFree||Number(x.fee)>0);const total=all.reduce((s,x)=>s+Number(x.fee||0),0),paid=all.filter(x=>x.isFree||x.paid).reduce((s,x)=>s+Number(x.isFree?0:(x.paidAmount||x.fee||0)),0),unpaid=all.filter(x=>!x.isFree&&!x.paid).reduce((s,x)=>s+Number(x.fee||0),0),completed=all.filter(x=>x.isFree||x.paid);return `<section class="page">${header('입금확인')}<div class="payment-summary"><div class="card mini-card"><div class="m-label">이번달 예정</div><div class="m-value">${shortMoney(total)}</div><div class="m-count">${all.length}건</div></div><div class="card mini-card"><div class="m-label">입금 완료</div><div class="m-value green">${shortMoney(paid)}</div><div class="m-count">${completed.length}건</div></div><div class="card mini-card"><div class="m-label">미수금</div><div class="m-value orange">${shortMoney(unpaid)}</div><div class="m-count">${all.filter(x=>!x.isFree&&!x.paid).length}건</div></div></div><div class="section-head"><h2>상세 내역</h2></div>
      ${all.length?all.map(paymentCard).join(''):empty('credit-card','입금 내역이 없어요','강의 기록에 강사료를 입력하면 나타납니다')}</section>`}
    function paymentCard(l){const complete=l.isFree||l.paid;return `<button class="card payment-card" style="display:block;width:100%;text-align:left" data-action="payment-edit" data-id="${l.id}"><div class="row"><h3>${esc(l.title)}</h3><span class="status ${complete?'paid':'unpaid'}">${icon(complete?'circle-check-big':'clock-3')}${l.isFree?'무페이 완료':complete?'확인완료':'대기중'}</span></div><div class="row"><span class="place">${esc(l.institution||l.location||'기관 미정')}</span><span class="date">${l.isFree?'입금 없음':complete?`완료일: ${paymentDate(l.paidDate)}`:`예정일: ${paymentDate(l.paymentDue)}`}</span></div><div class="row amount"><span>${l.isFree?'강의료':'신청구액'}</span><strong>${l.isFree?'무페이':'₩'+money(l.paid?l.paidAmount||l.fee:l.fee)}</strong></div></button>`}

    function renderMaterials(){const q=state.materialQuery.trim().toLowerCase();let list=[...state.data.materials];if(q)list=list.filter(x=>[x.title,x.url,x.fileName,x.fileType,x.displayType].some(v=>String(v||'').toLowerCase().includes(q)));if(state.materialSort==='newest')list.sort((a,b)=>String(b.createdAt||b.updatedAt||'').localeCompare(String(a.createdAt||a.updatedAt||'')));else if(state.materialSort==='name')list.sort((a,b)=>String(a.title||'').localeCompare(String(b.title||''),'ko'));else list.sort((a,b)=>Number(a.order||9999)-Number(b.order||9999)||String(a.title||'').localeCompare(String(b.title||''),'ko'));return `<section class="page lecture-page">${header('자료전달')}<p class="materials-intro">강의를 요청한 기관 담당자에게 이력서와 강의안을 쉽고 빠르게 전송해보세요.</p><form class="lecture-search" data-form="material-search"><div class="lecture-search-box">${icon('search')}<input class="control" name="query" type="search" value="${esc(state.materialQuery)}" placeholder="자료명·파일명 검색" aria-label="전달 자료 검색">${state.materialQuery?`<button type="button" class="lecture-search-clear" data-action="material-search-clear" aria-label="검색어 지우기">${icon('x')}</button>`:''}</div><button class="btn" type="submit">검색</button></form><div class="lecture-tools"><div class="helper">표시 자료 ${list.length}개</div><label class="sort-control" aria-label="자료 정렬">${icon('arrow-up-down')}<select class="sort-select" data-action="material-sort"><option value="custom" ${state.materialSort==='custom'?'selected':''}>표시순서</option><option value="newest" ${state.materialSort==='newest'?'selected':''}>최신순</option><option value="name" ${state.materialSort==='name'?'selected':''}>이름순</option></select></label></div>
      ${list.length?list.map(materialCard).join(''):empty('folder-open',q?'검색 결과가 없어요':'등록된 자료가 없어요',q?'다른 검색어를 입력해보세요':'이력서·포트폴리오·링크를 추가해보세요')}
      <button class="fab lecture-fab" data-action="material-add" aria-label="자료 추가">${icon('plus')}<span>자료 추가</span></button></section>`}
    function materialIcon(x){if(x.kind==='link')return 'youtube';if((x.displayType||'').includes('이미지'))return 'image';if((x.displayType||'').includes('슬라이드'))return 'presentation';return 'file-text'}

    async function handleSubmit(e){const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();const fd=new FormData(form),type=form.dataset.form;let saveMessage='저장했어요';
      if(type==='lecture-search'){state.lectureQuery=String(fd.get('query')||'').trim();render();return}
      if(type==='material-search'){state.materialQuery=String(fd.get('query')||'').trim();render();return}
      if(type==='event'){const eventId=fd.get('id'),isFree=fd.get('feeMode')==='free',seed={title:fd.get('title').trim(),date:fd.get('date'),start:fd.get('start'),end:fd.get('end'),location:fd.get('location').trim(),managerName:fd.get('managerName').trim(),managerPhone:fd.get('managerPhone').trim(),fee:isFree?0:parseMoney(fd.get('fee')),isFree,memo:fd.get('memo').trim()};if(fd.get('type')==='lecture'){const match=state.data.lectures.find(l=>sameLecture(l,seed)),id=match?.id||eventId||uid('lecture'),old=match||state.data.lectures.find(l=>l.id===id);const x=old?{...old,title:seed.title,date:seed.date,start:seed.start,end:seed.end,location:seed.location||old.location,managerName:seed.managerName||old.managerName||'',managerPhone:seed.managerPhone||old.managerPhone||'',fee:seed.fee,isFree,paid:isFree?true:(old.isFree?false:!!old.paid),paidAmount:isFree?0:(old.isFree?0:Number(old.paidAmount||0)),paidDate:isFree?seed.date:(old.isFree?'':old.paidDate||''),paymentDue:isFree?'':old.paymentDue||'',notes:old.notes||seed.memo,updatedAt:new Date().toISOString()} : lectureFromSchedule(seed,id);upsert(state.data.lectures,x);if(eventId){state.data.events=state.data.events.filter(v=>v.id!==eventId);if(eventId!==id)await deleteRemote(eventId)}saveMessage=isFree?'무페이 강의로 등록하고 입금완료 처리했어요':'스케줄과 강의기록에 함께 저장했어요'}else{const id=eventId||uid('event'),x={id,type:'personal',title:seed.title,date:seed.date,start:seed.start,end:seed.end,location:seed.location,memo:seed.memo};upsert(state.data.events,x)}}
      if(type==='task'){const id=fd.get('id')||uid('task'),old=state.data.tasks.find(x=>x.id===id),x={id,title:fd.get('title').trim(),date:fd.get('date'),done:old?.done||false};upsert(state.data.tasks,x)}
      if(type==='lecture'){const requestedId=fd.get('id'),seed={title:fd.get('title').trim(),date:fd.get('date'),start:fd.get('start')},match=requestedId?null:state.data.lectures.find(l=>sameLecture(l,seed)),id=requestedId||match?.id||uid('lecture'),old=state.data.lectures.find(x=>x.id===id)||{},isFree=fd.get('feeMode')==='free';const attachments=[...(old.attachments||[])];for(const file of fd.getAll('attachments'))if(file&&file.size){const blobId=uid('blob');await putBlob(blobId,file);attachments.push({id:uid('att'),blobId,name:file.name,type:file.type||'application/octet-stream',size:file.size})}const now=new Date().toISOString(),x={...old,id,title:seed.title,institution:fd.get('institution').trim(),location:fd.get('location').trim(),managerName:fd.get('managerName').trim(),managerPhone:fd.get('managerPhone').trim(),date:seed.date,start:seed.start,end:fd.get('end'),audience:fd.get('audience').trim(),people:Number(fd.get('people')||0),fee:isFree?0:parseMoney(fd.get('fee')),isFree,paymentDue:isFree?'':fd.get('paymentDue'),status:fd.get('status'),notes:fd.get('notes').trim(),attachments,paid:isFree?true:(old.isFree?false:!!old.paid),paidAmount:isFree?0:(old.isFree?0:Number(old.paidAmount||0)),paidDate:isFree?seed.date:(old.isFree?'':old.paidDate||''),recordSource:old.recordSource||'lecture',needsRecordUpdate:false,createdAt:old.createdAt||now,updatedAt:now};upsert(state.data.lectures,x);state.detailId=id;saveMessage=isFree?'무페이 강의로 저장하고 입금완료 처리했어요':'강의기록과 스케줄에 함께 저장했어요'}

      if(type==='material'){const id=fd.get('id')||uid('material'),old=state.data.materials.find(x=>x.id===id)||{};const kind=fd.get('kind'),file=fd.get('materialFile');let blobId=old.blobId,fileName=old.fileName,fileType=old.fileType,fileSize=old.fileSize;if(file&&file.size){if(blobId)await deleteBlob(blobId);blobId=uid('blob');await putBlob(blobId,file);fileName=file.name;fileType=file.type;fileSize=file.size}const now=new Date().toISOString(),x={...old,id,kind,title:fd.get('title').trim(),order:Math.max(1,Number(fd.get('order'))||nextMaterialOrder()),url:fd.get('url').trim(),blobId,fileName,fileType,fileSize,createdAt:old.createdAt||now,updatedAt:now};upsert(state.data.materials,x)}
      closeModal();saveData(saveMessage)}

      if(a==='material-search-clear'){state.materialQuery='';render();return}
      if(a==='date-select'){state.selectedDate=b.dataset.date;state.calendar=new Date(b.dataset.date+'T00:00:00');render();return}
      if(a==='cal-prev'||a==='cal-next'){state.calendar=new Date(state.calendar.getFullYear(),state.calendar.getMonth()+(a==='cal-next'?1:-1),1);render();return}
      if(a.endsWith('-delete')){await removeRecord(a,id);return}
      if(a==='blob-open'){await openBlob(id);return}
      if(a==='material-preview'){await previewMaterial(id);return}
      if(a==='material-share'){await shareMaterial(id);return}
    }    async function removeRecord(action,id){if(!confirm('정말 삭제할까요?'))return;if(action==='event-delete')state.data.events=state.data.events.filter(x=>x.id!==id);if(action==='task-delete')state.data.tasks=state.data.tasks.filter(x=>x.id!==id);if(action==='lecture-delete'){const x=state.data.lectures.find(v=>v.id===id);for(const a of x?.attachments||[])await deleteBlob(a.blobId);state.data.lectures=state.data.lectures.filter(x=>x.id!==id);state.detailId=null}if(action==='material-delete'){const x=state.data.materials.find(v=>v.id===id);if(x?.blobId)await deleteBlob(x.blobId);state.data.materials=state.data.materials.filter(x=>x.id!==id)}await deleteRemote(id);closeModal();saveData();toast('삭제했어요')}

    function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('youlove_lecture_files',1);req.onupgradeneeded=()=>req.result.createObjectStore('files');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
    function storagePath(id){return `shared/${id}`}
    async function legacyBlobPaths(id){
      if(!sb||!state.dbReady||!id)return [];
      const bucket=sb.storage.from('youlove-files'),{data:roots,error}=await bucket.list('',{limit:1000});
      if(error||!roots)return [];
      const paths=[];
      for(const entry of roots){
        if(entry.name==='shared')continue;
        if(entry.id){if(entry.name===id)paths.push(id);continue}
        const {data:files}=await bucket.list(entry.name,{limit:100,search:id});
        if(files?.some(file=>file.name===id))paths.push(`${entry.name}/${id}`)
      }
      return paths
    }
    async function migrateLegacyBlob(id){
      const bucket=sb.storage.from('youlove-files'),paths=await legacyBlobPaths(id);
      for(const path of paths){const {data,error}=await bucket.download(path);if(!error&&data){await bucket.upload(storagePath(id),data,{contentType:data.type||'application/octet-stream',upsert:true});return data}}
      return null
    }
    async function putBlob(id,blob){
      if(sb&&state.dbReady){const {error}=await sb.storage.from('youlove-files').upload(storagePath(id),blob,{contentType:blob.type||'application/octet-stream',upsert:true});if(!error)return;console.warn('Supabase 파일 저장 실패:',error)}
      const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(blob,id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>reject(tx.error)})
    }
    async function getBlob(id){if(!id)return null;if(sb&&state.dbReady){const {data,error}=await sb.storage.from('youlove-files').download(storagePath(id));if(!error&&data)return data;const legacy=await migrateLegacyBlob(id);if(legacy)return legacy}const db=await openDB();return new Promise((resolve,reject)=>{const req=db.transaction('files').objectStore('files').get(id);req.onsuccess=()=>{db.close();resolve(req.result||null)};req.onerror=()=>reject(req.error)})}
    async function deleteBlob(id){if(!id)return;if(sb&&state.dbReady){const paths=[storagePath(id),...await legacyBlobPaths(id)];await sb.storage.from('youlove-files').remove([...new Set(paths)])}const db=await openDB();return new Promise(resolve=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=()=>{db.close();resolve()}})}
    async function openBlob(id){const blob=await getBlob(id);if(!blob){toast('파일을 찾을 수 없어요');return}const url=URL.createObjectURL(blob);state.objectUrls.push(url);window.open(url,'_blank','noopener')}
    async function hydrateBlobs(){for(const el of document.querySelectorAll('[data-blob-id]')){const blob=await getBlob(el.dataset.blobId);if(!blob)continue;const url=URL.createObjectURL(blob);state.objectUrls.push(url);el.innerHTML=el.dataset.type.startsWith('video/')?`<video src="${url}" muted preload="metadata"></video><span style="position:absolute;color:white">${icon('play')}</span>`:`<img src="${url}" alt="강의 사진">`;el.style.position='relative'}icons()}
    async function previewMaterial(id){const x=state.data.materials.find(v=>v.id===id);if(!x)return;if(x.kind==='link'){if(!x.url){toast('웹 주소가 없어요');return}window.open(x.url,'_blank','noopener')}else await openBlob(x.blobId)}
    async function shareMaterial(id){const x=state.data.materials.find(v=>v.id===id);if(!x)return;try{if(x.kind==='file'&&x.blobId){const blob=await getBlob(x.blobId),file=new File([blob],x.fileName||x.title,{type:x.fileType||blob.type});if(navigator.canShare?.({files:[file]})){await navigator.share({title:x.title,files:[file]});return}}const text=x.url?`${x.title}\n${x.url}`:x.title;if(navigator.share){await navigator.share({title:x.title,text,url:x.url||undefined})}else{await navigator.clipboard.writeText(text);toast('전달할 내용을 복사했어요')}}catch(err){if(err.name!=='AbortError')toast('공유하지 못했어요')}}

    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;document.documentElement.classList.add('can-install')});
    window.addEventListener('appinstalled',()=>{installPrompt=null;document.documentElement.classList.remove('can-install');toast('Youlove 설치가 완료됐어요')});
    document.addEventListener('touchstart',e=>{if(e.touches.length!==1||!canStartPull(e.target))return;pullStart=e.touches[0].clientY;pullDistance=0;pulling=true},{passive:true});
    document.addEventListener('touchmove',e=>{if(!pulling)return;const delta=e.touches[0].clientY-pullStart;if(delta<=0){pulling=false;pullEl.classList.remove('visible');return}pullDistance=Math.min(92,delta*.68);if(pullDistance>6)e.preventDefault();updatePullIndicator(pullDistance)},{passive:false});
    document.addEventListener('touchend',()=>{if(!pulling)return;const shouldRefresh=pullDistance>=64;pulling=false;if(shouldRefresh)refreshAppData(true);else{pullDistance=0;pullEl.classList.remove('visible');pullEl.style.transform=''}},{passive:true});
    document.addEventListener('touchcancel',()=>{pulling=false;pullDistance=0;pullEl.classList.remove('visible');pullEl.style.transform=''},{passive:true});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!modalRoot.firstElementChild&&Date.now()-lastAutoRefresh>30000)refreshAppData(false)});
    if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('앱 설치 준비 실패:',err)));
    renderLoading();
    initSupabase();
  })();
  </script>
</body>
</html>
